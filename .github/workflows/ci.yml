name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Go builds interop/auth-go, the command that signs and verifies with auth-go for
      # tests/test_interop_auth_go.py. With AAUTH_SS_REQUIRE_GO=1 a missing toolchain
      # fails those tests instead of skipping them.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: interop/auth-go/go.sum
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download auth-go
        working-directory: interop/auth-go
        run: go mod download
      # The same offline gate a contributor runs locally: ruff, mypy, pytest under
      # branch coverage (fail_under in pyproject), conformance matrix and adversarial
      # results not stale. No step needs outbound network beyond package install.
      - name: Gate
        env:
          AAUTH_SS_REQUIRE_GO: "1"
        run: python tools/check.py
