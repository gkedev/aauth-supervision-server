name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push cancels a run still going on a branch, never on main, so every commit on
# main keeps a finished run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Python 3.14 runs as a preview and does not fail the run; it joins the supported
    # versions (badge and classifiers) once it passes on every OS here. coverage 7.6.1 has
    # no 3.14 wheel and runs there without its C tracer, so the suite takes about twice as
    # long.
    continue-on-error: ${{ matrix.python == '3.14' }}
    timeout-minutes: ${{ matrix.python == '3.14' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    # Actions are pinned by commit, with the release in a comment.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      # Go builds interop/aauth-go, the command that signs and verifies with aauth-go for
      # tests/test_interop_aauth_go.py. With AAUTH_SS_REQUIRE_GO=1 a missing toolchain
      # fails those tests instead of skipping them.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: interop/aauth-go/go.sum
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Download aauth-go
        working-directory: interop/aauth-go
        run: go mod download
      # The same offline gate a contributor runs locally: ruff, mypy, pytest under
      # branch coverage (fail_under in pyproject), conformance matrix and adversarial
      # results not stale. No step needs outbound network beyond package install.
      - name: Gate
        env:
          AAUTH_SS_REQUIRE_GO: "1"
        run: python tools/check.py
