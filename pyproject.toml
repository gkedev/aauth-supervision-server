[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aauth-supervision-server"
version = "0.1.0"
description = "Independent AAuth Supervision Server (AAuth Supervision -00) with a deterministic, composition-aware policy (Agentic Principal Chain model)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "Xabier Muruaga"}]
keywords = ["aauth", "authorization", "agents", "supervision", "ietf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["cryptography>=45.0"]

[project.urls]
Homepage = "https://github.com/xmuruaga/aauth-supervision-server"
Issues = "https://github.com/xmuruaga/aauth-supervision-server/issues"
Changelog = "https://github.com/xmuruaga/aauth-supervision-server/blob/main/CHANGELOG.md"
Specification = "https://dickhardt.github.io/AAuth/draft-hardt-aauth-supervision.html"

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.112.2",
    "coverage==7.6.1",
    "mutmut==2.5.1",
    "ruff==0.6.9",
    "mypy==1.11.2",
    # An independent AAuth signature implementation, for tests/test_interop_regent_httpsig.py.
    "regent-httpsig==0.7.1",
    "httpx==0.28.1",
]

[project.scripts]
aauth-ss = "aauth_supervision_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aauth_supervision_server = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["UP038"]  # deprecated rule: isinstance tuples are faster than X | Y

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
# Branch-coverage threshold, enforced by tools/check.py and CI. Every line and branch
# of src/ runs under the suite; the only exclusions are listed below (no inline pragmas).
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # Protocol (interface) declarations: their bodies are `...` and never execute.
    "class .*\\(Protocol\\):",
]

# Mutation testing (mutmut 2.5.x) is configured in setup.cfg; see docs/mutation-testing.md.
