[mutmut]
# mutmut 2.5.x reads its configuration from setup.cfg. The default run mutates the
# three decision-critical modules against the full suite; for a faster campaign scope
# one module with --paths-to-mutate and a focused --runner (docs/mutation-testing.md).
paths_to_mutate=src/aauth_supervision_server/policy.py,src/aauth_supervision_server/httpsig.py,src/aauth_supervision_server/service.py
tests_dir=tests/
runner=python -m pytest -q -x -p no:cacheprovider
